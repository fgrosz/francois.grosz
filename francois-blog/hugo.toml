baseURL = "https://USERNAME.github.io/"
languageCode = "fr-FR"
title = "Mon Blog Tech"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
enableEmoji = true

[params]
  author = "Ton Nom"
  description = "Blog de formations et articles tech"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "👋 Bienvenue"
    Content = "Articles et formations sur le développement Java, Quarkus, et l'écosystème cloud."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/USERNAME"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Articles"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "formations"
    name = "Formations"
    url = "/formations/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"
